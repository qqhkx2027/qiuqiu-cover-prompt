interface:
  display_name: "秋秋公众号封面"
  short_description: "从文章生成统一的 2.35:1 秋秋公众号封面"
  default_prompt: "Use $qiuqiu-wechat-cover to create a QIUQIU WeChat article cover. First read the full article or Markdown path, then build a role-based reference_manifest instead of relying on image order. Route the task to GENERATE, COMPOSITE, or LOCAL_EDIT; use COMPOSITE for exact real assets and LOCAL_EDIT for targeted changes. If asked to plan, propose three hooks; if asked to generate, choose the best hook and proceed. Keep 2.35:1 and bright warm wood pixel style, render confirmed Chinese copy with the deterministic text script when possible, save media outside the skill repository, and never invent logos or products."
